<div id="lockScreen">
    <h1>🔐 Welcome Annie ❤️</h1>
    <p>Enter Our Secret Password</p>

    <input type="password" id="pass" placeholder="Password">

    <br><br>

    <button onclick="checkPass()">Unlock ❤️</button>

    <p id="wrong"></p>
</div>

<div id="main" style="display:none">

<h1>❤️ Welcome Annie ❤️</h1>

<p class="msg">
Every moment with you is special ❤️
</p>

<button onclick="loveLetter()">
Open My Heart ❤️
</button>

<div id="letter"></div>

</div>

<style>

body{
margin:0;
background:#ffb6c1;
font-family:Arial;
text-align:center;
overflow:hidden;
}

#lockScreen{
margin-top:120px;
}

input{
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
}

button{
padding:12px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:#ff3366;
color:white;
}

.msg{
font-size:22px;
}

#letter{
margin-top:30px;
font-size:22px;
padding:20px;
color:white;
}

.heart{
position:fixed;
color:red;
animation:fly 6s linear infinite;
}

@keyframes fly{

0%{
transform:translateY(100vh);
opacity:0;
}

100%{
transform:translateY(-100vh);
opacity:1;
}

}

</style>

<script>

function checkPass(){

let p=document.getElementById("pass").value;

if(p=="1505"){

document.getElementById("lockScreen").style.display="none";

document.getElementById("main").style.display="block";

hearts();

}

else{

document.getElementById("wrong").innerHTML="❌ Wrong Password";

}

}

function hearts(){

for(let i=0;i<40;i++){

let h=document.createElement("div");

h.innerHTML="❤️";

h.className="heart";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(20+Math.random()*20)+"px";

h.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(h);

}

}

function loveLetter(){

document.getElementById("letter").innerHTML=

`Dear Annie ❤️<br><br>

You are the most beautiful chapter of my life.

Thank you for making my world brighter.

I Love You Forever ❤️`;

}

</script>
